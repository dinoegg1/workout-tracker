[package]
name = "workout-tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.9", features = [ "runtime-tokio", "tls-native-tls", "mysql", "chrono"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
